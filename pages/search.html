  <div id="rv-section" style="padding:1rem 1rem 0;display:none">
    <div style="font-family:'Playfair Display', Georgia, 'Times New Roman', serif;font-size:16px;font-weight:700;color:#111;margin-bottom:.75rem">Recently viewed</div>
    <div id="rv-strip" style="display:flex;gap:.75rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.5rem"></div>
  </div>
  <footer class="site-footer" id="site-footer"></footer>
  <!-- Compare bar -->
  <div id="compare-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #1a5c45;padding:.75rem 1rem;z-index:500;gap:.75rem;align-items:center;box-shadow:0 -4px 20px rgba(0,0,0,.1)"></div>

  <!-- Recently viewed -->
  <div id="rv-wrap" style="padding:1rem 1rem 0;display:none">
    <div style="font-family:'Playfair Display', Georgia, 'Times New Roman', serif;font-size:16px;font-weight:700;color:#111;margin-bottom:.75rem">Recently viewed</div>
    <div id="rv-strip" style="display:flex;gap:.75rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.5rem;scrollbar-width:none"></div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- ════════════════════════════════════════════════════════════════════
       LUXE SEARCH BOOT — injects the editorial header, marks the body
       so the luxe skin activates, and wires the filter-icon click to
       the existing #filter-modal. Delete this <script id="lx-search-boot">
       block AND the matching <style id="lx-search-skin"> in <head> to
       revert. Or restore /pages/search-classic-backup.html.
       ════════════════════════════════════════════════════════════════════ -->
  <script id="lx-search-boot">
  ;(function luxeSearchBoot(){
    // Tag the body so the skin's CSS rules activate
    document.body.classList.add('lx-search')

    // Build the new editorial header (search · LOGO · filter)
    var hdr = document.createElement('header')
    hdr.className = 'lxs-header'
    hdr.innerHTML =
      '<button class="lxs-header-btn" type="button" aria-label="Toggle search" id="lxs-search-btn">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>' +
        '</svg>' +
      '</button>' +
      '<a class="lxs-header-logo" href="/" aria-label="Movin home">mov<span>in</span></a>' +
      '<button class="lxs-header-btn" type="button" aria-label="Filters" id="lxs-filter-btn">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<line x1="3" y1="6" x2="21" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/>' +
        '</svg>' +
      '</button>'

    // Insert before the existing .sr-topbar (which becomes the chip rail)
    var topbar = document.querySelector('.sr-topbar')
    if (topbar && topbar.parentNode) topbar.parentNode.insertBefore(hdr, topbar)
    else document.body.insertBefore(hdr, document.body.firstChild)

    // ── Header search button → reveals the original .sr-search-row so
    //    the user can still free-text search. Tap again to hide it.
    var searchBtn = document.getElementById('lxs-search-btn')
    var searchRow = document.querySelector('.sr-search-row')
    if (searchBtn && searchRow) {
      searchBtn.addEventListener('click', function(){
        var hidden = getComputedStyle(searchRow).display === 'none'
        searchRow.style.cssText = hidden
          ? 'display:flex !important;padding:14px 18px;background:#07251c;border-bottom:1px solid rgba(250,247,240,.08);gap:8px'
          : ''
        if (hidden) {
          // Restyle the input + button to fit the dark header
          var input = searchRow.querySelector('.sr-input')
          if (input) {
            input.style.cssText = 'flex:1;background:rgba(250,247,240,.08);border:1px solid rgba(250,247,240,.18);color:#faf7f0;border-radius:999px;padding:10px 18px;font-size:16px;font-family:DM Sans,sans-serif;outline:none'
            input.style.setProperty('::placeholder', 'color:rgba(241,235,220,.55)')
            setTimeout(function(){ input.focus() }, 50)
          }
          var btn = searchRow.querySelector('.sr-search-btn')
          if (btn) btn.style.cssText = 'background:#e07b3f;color:#fff;border:none;border-radius:999px;padding:10px 22px;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:DM Sans,sans-serif'
        }
      })
    }

    // ── Header filter button → opens the existing #filter-modal ──
    var filterBtn = document.getElementById('lxs-filter-btn')
    if (filterBtn) {
      filterBtn.addEventListener('click', function(){
        var fm = document.getElementById('filter-modal')
        if (fm) fm.classList.add('open')
      })
    }

    // ── Editorial results-count phrasing — replaces "X properties"
    //    with "Showing X residences" once the existing render writes
    //    its count text. We watch the node for mutations.
    var countEl = document.querySelector('.results-count')
    if (countEl) {
      var beautify = function(){
        var txt = (countEl.textContent || '').trim()
        // Pull leading number out
        var m = txt.match(/^(\d[\d,]*)\s+(.*)$/)
        if (!m) return
        var n = m[1]
        // Avoid infinite loop — only rewrite if it doesn't already use <em>
        if (countEl.querySelector('em')) return
        countEl.innerHTML = 'Showing <em>' + n + '</em> ' + (m[2] || 'properties')
      }
      var mo = new MutationObserver(beautify)
      mo.observe(countEl, { childList:true, characterData:true, subtree:true })
      beautify()
    }

    // ── Filter-chip "is-set" tracker — paints orange when a value is
    //    selected, neutral when blank. Sets data-empty="1" so the CSS
    //    `:not([data-empty="1"])` rule can switch states. ─────────────
    function refreshChipState(chip){
      if (!chip || chip.tagName !== 'SELECT') return
      if (chip.value && chip.value !== '') {
        chip.removeAttribute('data-empty')
        chip.classList.add('is-set')
      } else {
        chip.setAttribute('data-empty', '1')
        chip.classList.remove('is-set')
      }
    }
    document.querySelectorAll('select.qf-chip').forEach(function(sel){
      refreshChipState(sel)
      sel.addEventListener('change', function(){ refreshChipState(sel) })
    })
    // Also refresh after the existing applyTypeAwareFilters() rebuilds
    // the option lists (price ranges differ per listing type)
    var _origApply = window.applyTypeAwareFilters
    if (typeof _origApply === 'function') {
      window.applyTypeAwareFilters = function(){
        var r = _origApply.apply(this, arguments)
        document.querySelectorAll('select.qf-chip').forEach(refreshChipState)
        return r
      }
    }

    // ── Inject a real "Enquire Now" button into each property card ──
    // Card click navigates to /listing.html?id=…  The Enquire button
    // stops propagation, appends ?enquire=1 and lands the user
    // directly on the open enquiry form. ────────────────────────────
    var ENQUIRE_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>' +
      '</svg>'

    function getListingIdFromCard(card){
      // The existing card has onclick="window.location.href='listing.html?id=XXXX'"
      var oc = card.getAttribute('onclick') || ''
      var m = oc.match(/[?&]id=([^&'"]+)/)
      return m ? m[1] : null
    }
    function decorateCard(card){
      if (!card || card.dataset.lxEnquire === '1') return
      // Skip list-view rows (the button shouldn't appear there)
      if (card.closest('.listings-list')) return
      var body = card.querySelector('.prop-card-body')
      if (!body) return
      var id = getListingIdFromCard(card)
      if (!id) return
      var btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'lx-enquire-btn'
      btn.setAttribute('aria-label', 'Enquire about this property')
      btn.innerHTML = ENQUIRE_SVG + '<span>Enquire Now</span>'
      btn.addEventListener('click', function(e){
        e.stopPropagation()
        e.preventDefault()
        // Mark as "in progress" so a fast double-tap doesn't double-navigate
        if (btn.dataset.busy === '1') return
        btn.dataset.busy = '1'
        window.location.href = 'listing.html?id=' + encodeURIComponent(id) + '&enquire=1'
      })
      body.appendChild(btn)
      card.dataset.lxEnquire = '1'
    }
    function decorateAllCards(){
      document.querySelectorAll('.prop-card').forEach(decorateCard)
    }
    decorateAllCards()
    // Re-run as the results grid is re-rendered (search, sort, paginate)
    var grid = document.querySelector('.listings-grid') || document.querySelector('.listings-list')
    if (grid && 'MutationObserver' in window) {
      new MutationObserver(decorateAllCards).observe(grid, { childList: true, subtree: true })
    }
  })();
  </script>

</body>
